[General]
EnableLogging=1
LogVerboseCalls=1

[Spoof]
EnableFeatureLevelSpoof=0
TargetFeatureLevel=12_0
SpoofVRAMMB=4096

[Downgrader]
; Phase 3 Shader & Pipeline State Inspection and Policy flags
EnableShaderInspection=1
EnableShaderFallback=0
EnableTextureClamping=0
MaxTextureResolution=512
StripHeavyShaders=0

[Translation]
; Phase 4 Direct3D 12 to Direct3D 11 Translation Engine
; Master toggle: 0 = Direct native D3D12 passthrough (default), 1 = Enable D3D11 translation
EnableD3D11Translation=0
EmulateBarriers=1
EnableStateTracking=1
ImmediateQueueFlush=1
EmulateQueries=1
