; ==============================================================================
; KeplerBridge Configuration Profile (kepler_bridge.ini)
; Direct3D 12-to-Direct3D 11 Compatibility Translation Proxy for NVIDIA Kepler
; Target Hardware: NVIDIA GeForce GT 740 (GK107 silicon, 4 GB DDR3, 128-bit memory bus, 21.3 GB/s bandwidth, Native FL 11_0)
; ==============================================================================

[Configuration]
SchemaVersion=2
EnableProfileAutoDetect=1
ActiveProfile=Auto

; ------------------------------------------------------------------------------
; Default Fallback Profile
; Safe conservative baseline for any unrecognized application
; ------------------------------------------------------------------------------
[Profile.Default]
ProfileDescription=Default Conservative Compatibility Profile
EnableLogging=1
LogVerboseCalls=0

; Hardware Spoofing (Disabled by default for safety)
EnableFeatureLevelSpoof=0
TargetFeatureLevel=11_0
SpoofVRAMMB=4096

; Translation Engine
EnableD3D11Translation=0
EmulateBarriers=1
EnableStateTracking=1
ImmediateQueueFlush=1
EmulateQueries=1

; Resource Clamping & Shader Policy
EnableShaderInspection=1
EnableShaderFallback=0
EnableTextureClamping=0
MaxTextureResolution=1024
StripHeavyShaders=0

; Authentic Kepler Hardware Limits
MaxConcurrentUAVs=8
SafeFlipModeFallback=1

; Shader Disk Cache
EnableShaderDiskCache=1
CacheDirectory=kepler_cache/shaders

; ------------------------------------------------------------------------------
; Palworld Profile (Unreal Engine 5.1 / Agility SDK)
; ------------------------------------------------------------------------------
[Profile.Palworld-Win64-Shipping]
ProfileDescription=Palworld (Unreal Engine 5.1 / Agility SDK)
EnableLogging=1
LogVerboseCalls=0

; Feature level 12_0 advertised to satisfy UE5 startup RHI validation
EnableFeatureLevelSpoof=1
TargetFeatureLevel=12_0
SpoofVRAMMB=4096

; Translation Engine active for D3D12 commands
EnableD3D11Translation=1
EmulateBarriers=1
EnableStateTracking=1
ImmediateQueueFlush=1
EmulateQueries=1

; Downgrader & Texture Clamping:
; Clamp textures to 1024 to prevent saturating 21.3 GB/s DDR3 memory bus
EnableShaderInspection=1
EnableShaderFallback=0
EnableTextureClamping=1
MaxTextureResolution=1024
StripHeavyShaders=0

; Strict Kepler Hardware Constraints:
; Native Kepler FL 11_0 hardware limit: exactly 8 concurrent UAV slots (u0..u7)
MaxConcurrentUAVs=8
SafeFlipModeFallback=1

; Shader Disk Cache: Dedicated cache directory for Palworld shaders
EnableShaderDiskCache=1
CacheDirectory=kepler_cache/palworld_shaders

